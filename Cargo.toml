[package]
name = "feral"
version = "2.1.0"
edition = "2021"
description = "feral - a peer-to-peer mesh LAN chat with persistent cryptographic peer identity"

[[bin]]
name = "feral"
path = "src/main.rs"

[dependencies]
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
zeroize = "1"
sha2 = "0.10"
hex = "0.4"
if-addrs = "0.13"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
ctrlc = "3"

[profile.release]
opt-level = 2
